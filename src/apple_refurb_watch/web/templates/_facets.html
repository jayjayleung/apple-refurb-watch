{% for group in facets %}
<details class="facet"{% if loop.first or group.options|selectattr('checked')|list %} open{% endif %}>
  <summary>{{ group.legend }}</summary>
  <div class="facet-options">
    {% for opt in group.options %}
    {% set unavailable = opt.count == 0 and not opt.checked %}
    <label class="check"{% if unavailable %} aria-disabled="true"{% endif %}>
      <input type="checkbox" name="d_{{ group.key }}" value="{{ opt.value }}" {% if opt.checked %}checked{% endif %}{% if unavailable %} disabled{% endif %}>
      <span>{{ opt.label }}</span>
    </label>
    {% endfor %}
  </div>
</details>
{% endfor %}
