<div class="watch-preview-body">
  <p>{{ text }}</p>
  {% if samples %}
  <div class="preview-thumbs">
    {% for item in samples %}
    <a href="{{ item.url }}" target="_blank" rel="noreferrer" title="{{ item.title }}">
      {% if item.image_url %}
      <img src="{{ item.image_url|thumb }}" alt="" width="54" height="54">
      {% endif %}
    </a>
    {% endfor %}
  </div>
  {% endif %}
</div>
