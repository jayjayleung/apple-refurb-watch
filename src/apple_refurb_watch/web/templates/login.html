<!DOCTYPE html>
<html lang="zh-CN"{% if request.headers.get("user-agent", "").startswith("AppleRefurbWatchDesktop/") %} class="desktop"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161617" media="(prefers-color-scheme: dark)">
  <title>登录 · 官翻监听</title>
  {% include "_desktop_mark.html" %}
  <link rel="icon" href="/static/icon.svg?v=listen-1" type="image/svg+xml">
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/static/icon-256.png">
  <link rel="stylesheet" href="/static/style.css?v=nav-update-1">
</head>
<body class="login-shell">
  <main class="login-wrap">
    <p class="login-mark"><img class="brand-icon" src="/static/icon.svg?v=listen-1" width="28" height="28" alt=""><span class="brand-name">官翻监听</span>{% include "_github.html" %}</p>
    <h1>输入访问口令</h1>
    <form class="login-card" method="post" action="/login">
      <label for="token">访问口令</label>
      <input id="token" name="token" type="password" autocomplete="current-password" required autofocus {% if error %}aria-invalid="true"{% endif %}>
      {% if error %}<p class="field-error" role="alert">访问口令不正确。</p>{% endif %}
      <button class="btn primary login-go" type="submit">进入</button>
    </form>
  </main>
</body>
</html>
