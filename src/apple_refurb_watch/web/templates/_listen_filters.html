<form method="post" action="/watches/from-filters">
  <input type="hidden" name="listing_key" value="{{ listing_key }}">
  <input type="hidden" name="q" value="{{ q }}">
  <input type="hidden" name="max_price" value="{{ max_price }}">
  <input type="hidden" name="min_ram_gb" value="{{ min_ram_gb }}">
  <input type="hidden" name="min_storage_gb" value="{{ min_storage_gb }}">
  {% for key, values in selected_dims.items() %}
    {% for value in values %}
    <input type="hidden" name="d_{{ key }}" value="{{ value }}">
    {% endfor %}
  {% endfor %}
  <button class="btn primary" type="submit">按此条件听</button>
</form>
