{% if items %}
<div class="grid" id="product-grid">
  {% include "_product_cards.html" %}
</div>
<div class="grid-skeleton" aria-hidden="true">
  {% for i in range(8) %}
  <div class="skeleton-card">
    <div class="card-media"></div>
    <div class="card-body">
      <span class="skel"></span>
      <span class="skel skel-sm"></span>
    </div>
  </div>
  {% endfor %}
</div>
{% include "_more.html" %}
{% else %}
<div class="empty">
  {% if not stock_count %}
  <p>暂无在售商品。</p>
  {% include "_scan.html" %}
  {% else %}
  <p>没有符合筛选条件的商品。</p>
  {% endif %}
</div>
{% endif %}
