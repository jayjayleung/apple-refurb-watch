<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>连接服务器 · 官翻监听</title>
  <style>
    :root {
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --paper: #f5f5f7;
      --card: #fff;
      --line: #d2d2d7;
      --accent: #0071e3;
      --bad: #d70015;
      --busy: #9a6b00;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--sans); }
    main { max-width: 28rem; margin: 12vh auto; padding: 0 1.25rem; }
    h1 { font-size: 1.4rem; font-weight: 650; margin: 0 0 0.4rem; }
    .lede, .hint { color: var(--muted); }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 1.2rem 1.25rem;
      margin-top: 1rem;
    }
    label { display: block; margin: 0.7rem 0; }
    input[type="text"], input[type="password"], input[type="url"] {
      width: 100%; margin-top: 0.25rem; padding: 0.55rem 0.7rem;
      border: 1px solid var(--line); border-radius: 10px; font: inherit;
    }
    .check { display: flex; gap: 0.45rem; align-items: center; }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
    .btn {
      border: 0; border-radius: 10px; padding: 0.55rem 0.9rem; font: inherit; cursor: pointer;
      background: #e8e8ed; color: var(--ink);
    }
    .btn.primary { background: var(--accent); color: #fff; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .flash { padding: 0.7rem 0.9rem; border-radius: 12px; margin: 0.8rem 0 0; }
    .flash.bad { background: #fde8ea; color: var(--bad); }
    .flash.warn { background: #fff4d6; color: var(--busy); }
    .flash.ok { background: #e8f6ec; color: #248a3d; }
  </style>
</head>
<body>
  <main>
    <h1>连接服务器</h1>
    <p class="lede">本机跑一份，或改连已经在 NAS / VPS 上的那一份。改连接后窗口会重启。</p>
    <p id="status" class="flash warn" hidden></p>
    <section class="panel">
      <label>服务器地址
        <input id="url" type="url" placeholder="http://192.168.1.8:8765" autocomplete="off">
      </label>
      <label>访问口令
        <input id="token" type="password" placeholder="远端开启远程访问后的口令">
      </label>
      <label class="check"><input id="insecure" type="checkbox"> 允许公网 HTTP（不推荐）</label>
      <p class="hint">公网请用 https://。内网 NAS 用 HTTP 即可。口令不要写在地址里。</p>
      <div class="row">
        <button class="btn primary" id="connect" type="button">连接服务器</button>
        <button class="btn" id="local" type="button">改回本机</button>
        <button class="btn" id="back" type="button">取消</button>
      </div>
    </section>
  </main>
  <script>
    function $(id) { return document.getElementById(id); }
    function setStatus(text, kind) {
      var el = $("status");
      el.hidden = !text;
      el.className = "flash " + (kind || "warn");
      el.textContent = text || "";
    }
    function api() {
      return window.pywebview && window.pywebview.api ? window.pywebview.api : null;
    }
    function fill(s) {
      if (s.url) $("url").value = s.url;
      $("insecure").checked = !!s.allow_insecure;
      if (s.has_token) $("token").placeholder = "已保存，留空不改";
      if (s.env_locked) {
        $("connect").disabled = true;
        $("local").disabled = true;
        setStatus("当前由环境变量 APPLE_REFURB_WATCH_URL 指定，界面无法改连接。", "warn");
        return;
      }
      if (s.error) setStatus(s.error, "bad");
      else if (s.notice) setStatus(s.notice, "warn");
      else if (s.mode === "remote") setStatus("已连接 " + (s.url || "") + "。本机不扫描。", "ok");
    }
    function boot() {
      var bridge = api();
      if (!bridge) {
        setStatus("请从桌面包打开此页。", "bad");
        return;
      }
      bridge.state().then(fill);
      $("connect").addEventListener("click", function () {
        setStatus("正在保存…", "warn");
        bridge.connect($("url").value, $("token").value, $("insecure").checked).then(function (r) {
          if (!r || !r.ok) {
            setStatus((r && r.error) || "连接失败", "bad");
            return;
          }
          setStatus("正在重启窗口…", "ok");
        });
      });
      $("local").addEventListener("click", function () {
        bridge.disconnect().then(function (r) {
          if (!r || !r.ok) {
            setStatus((r && r.error) || "无法改回本机", "bad");
            return;
          }
          setStatus("正在重启窗口…", "ok");
        });
      });
      $("back").addEventListener("click", function () {
        bridge.open_app().then(function (r) {
          if (!r || !r.ok) setStatus((r && r.error) || "还没有可用的服务", "bad");
        });
      });
    }
    window.addEventListener("pywebviewready", boot);
    if (window.pywebview && window.pywebview.api) boot();
  </script>
</body>
</html>
