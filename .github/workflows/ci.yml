name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        env:
          PYTHONUTF8: "1"
        shell: bash
        run: |
          python -m pytest --tb=short -q >pytest-out.txt 2>&1
          status=$?
          cat pytest-out.txt
          exit $status
      - name: Publish pytest failures
        if: failure()
        shell: bash
        run: |
          echo '==== pytest-out.txt ===='
          cat pytest-out.txt || echo 'missing pytest-out.txt'
          python -c "from pathlib import Path; p=Path('pytest-out.txt'); t=(p.read_text(encoding='utf-8', errors='replace') if p.exists() else 'missing pytest-out.txt')[:2000].replace('%','%25').replace('\r','').replace('\n','%0A'); print('::error::'+t)"
