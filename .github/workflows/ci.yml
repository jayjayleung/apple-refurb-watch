name: ci

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        env:
          PYTHONUTF8: "1"
        # pwsh 会把 pytest 写到 stderr 的 warnings 当成步骤失败。
        shell: bash
        run: python -m pytest --tb=short -q

  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: apple-refurb-watch-linux-x86_64
            pip_pkg: "."
          - os: windows-latest
            asset: apple-refurb-watch-windows-x86_64
            pip_pkg: ".[desktop]"
          - os: macos-latest
            asset: apple-refurb-watch-macos-arm64
            pip_pkg: ".[desktop]"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ matrix.pip_pkg }}" pyinstaller
      - name: Build
        run: python -m PyInstaller --noconfirm --clean packaging/apple-refurb-watch.spec
      - name: Zip
        run: |
          mkdir -p dist/out
          python -c "import shutil; shutil.make_archive('dist/out/${{ matrix.asset }}', 'zip', 'dist', 'apple-refurb-watch')"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/out/${{ matrix.asset }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: packaging/RELEASE_NOTES.md
          generate_release_notes: true
