name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          enable-cache: true
      - name: Ruff
        run: uvx ruff check src tests

  test:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra dev
      - name: Test
        env:
          PYTHONUTF8: "1"
        # pwsh 会把 pytest 写到 stderr 的 warnings 当成步骤失败。
        shell: bash
        run: uv run python -m pytest --tb=short -q
      - name: CLI smoke
        env:
          PYTHONUTF8: "1"
          APPLE_REFURB_WATCH_HOME: ${{ runner.temp }}/apple-refurb-watch-smoke-data
          APPLE_REFURB_WATCH_LOG: ${{ runner.temp }}/apple-refurb-watch-smoke-log
        shell: bash
        run: |
          uv run apple-refurb-watch version
          uv run apple-refurb-watch desktop --probe

  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [lint, test]
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: apple-refurb-watch-linux-x86_64
            onefile_asset: apple-refurb-watch-linux-x86_64
            uv_extra: "--extra pack"
          - os: windows-latest
            asset: apple-refurb-watch-windows-x86_64
            onefile_asset: apple-refurb-watch-windows-x86_64.exe
            uv_extra: "--extra desktop --extra pack"
          - os: macos-latest
            asset: apple-refurb-watch-macos-arm64
            onefile_asset: apple-refurb-watch-macos-arm64
            uv_extra: "--extra desktop --extra pack"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          enable-cache: true
      - name: Install
        run: uv sync --locked ${{ matrix.uv_extra }}
      - name: Build
        run: uv run python -m PyInstaller --noconfirm --clean --distpath dist/onedir --workpath build/onedir packaging/apple-refurb-watch.spec
      - name: Onedir smoke test
        env:
          APPLE_REFURB_WATCH_HOME: ${{ runner.temp }}/apple-refurb-watch-onedir-data
          APPLE_REFURB_WATCH_LOG: ${{ runner.temp }}/apple-refurb-watch-onedir-log
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            bin="dist/onedir/apple-refurb-watch/apple-refurb-watch.exe"
          else
            bin="dist/onedir/apple-refurb-watch/apple-refurb-watch"
          fi
          "$bin" version
          "$bin" desktop --probe
      - name: Build onefile
        env:
          APPLE_REFURB_WATCH_BUILD: onefile
        run: uv run python -m PyInstaller --noconfirm --clean --distpath dist/onefile --workpath build/onefile packaging/apple-refurb-watch.spec
      - name: Onefile smoke test
        env:
          APPLE_REFURB_WATCH_HOME: ${{ runner.temp }}/apple-refurb-watch-smoke-data
          APPLE_REFURB_WATCH_LOG: ${{ runner.temp }}/apple-refurb-watch-smoke-log
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            onefile="dist/onefile/apple-refurb-watch.exe"
          else
            onefile="dist/onefile/apple-refurb-watch"
          fi
          expected_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          got_version="$("$onefile" version | tr -d '\r')"
          if [[ -n "$got_version" ]]; then
            test "$got_version" = "$expected_version"
          fi
          "$onefile" desktop --probe
          if [[ "$RUNNER_OS" != "Linux" ]]; then
            exit 0
          fi
          cleanup() {
            "$onefile" stop >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          port="$(python -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
          "$onefile" serve --detach --host 127.0.0.1 --port "$port"
          python - "$port" "$expected_version" <<'PY'
          import json
          import sys
          import time
          from urllib.request import urlopen

          url = f"http://127.0.0.1:{sys.argv[1]}/api/health"
          expected_version = sys.argv[2]
          deadline = time.monotonic() + 60
          while time.monotonic() < deadline:
              try:
                  with urlopen(url, timeout=2) as response:
                      payload = json.load(response)
                  if payload.get("ok") and payload.get("server_version") == expected_version:
                      break
              except Exception:
                  time.sleep(0.5)
          else:
              raise SystemExit("onefile serve --detach health check timed out")
          PY
      - name: Package artifacts
        run: |
          set -euo pipefail
          mkdir -p dist/out
          python -c "import shutil; shutil.make_archive('dist/out/${{ matrix.asset }}', 'zip', 'dist/onedir', 'apple-refurb-watch')"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp dist/onefile/apple-refurb-watch.exe "dist/out/${{ matrix.onefile_asset }}"
          else
            cp dist/onefile/apple-refurb-watch "dist/out/${{ matrix.onefile_asset }}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/out/${{ matrix.asset }}.zip
            dist/out/${{ matrix.onefile_asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: packaging/RELEASE_NOTES.md
          generate_release_notes: true
