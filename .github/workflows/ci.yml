name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        env:
          PYTHONUTF8: "1"
        run: python -m pytest --tb=short -q
      - name: Publish pytest failures
        if: failure()
        shell: bash
        run: |
          if [[ -f pytest-failures.txt ]]; then
            cat pytest-failures.txt
            python -c "from pathlib import Path; t=Path('pytest-failures.txt').read_text(encoding='utf-8')[:1500].replace('%','%25').replace('\r','').replace('\n','%0A'); print('::error::'+t)"
          else
            echo '::error::pytest failed without pytest-failures.txt'
          fi
