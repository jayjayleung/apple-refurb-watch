name: package

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest

  build:
    name: ${{ matrix.asset }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: apple-refurb-watch-linux-x86_64
            pip_pkg: "."
          - os: windows-latest
            asset: apple-refurb-watch-windows-x86_64.exe
            pip_pkg: ".[desktop]"
          - os: macos-latest
            asset: apple-refurb-watch-macos-arm64
            pip_pkg: ".[desktop]"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ matrix.pip_pkg }}" pyinstaller
      - name: Build
        run: python -m PyInstaller --noconfirm --clean packaging/apple-refurb-watch.spec
      - name: Rename
        run: |
          mkdir -p dist/out
          if [ -f dist/apple-refurb-watch.exe ]; then
            mv dist/apple-refurb-watch.exe "dist/out/${{ matrix.asset }}"
          else
            mv dist/apple-refurb-watch "dist/out/${{ matrix.asset }}"
          fi
          chmod +x "dist/out/${{ matrix.asset }}" || true
      - name: Smoke
        env:
          APPLE_REFURB_WATCH_HOME: ${{ runner.temp }}/arw-smoke
          APPLE_REFURB_WATCH_LOG: ${{ runner.temp }}/arw-smoke-log
          PYTHONUTF8: "1"
        run: |
          bin="./dist/out/${{ matrix.asset }}"
          "$bin" version
          "$bin" serve --detach
          ok=
          for _ in $(seq 1 25); do
            if curl -fsS "http://127.0.0.1:8765/api/health"; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "health check failed"
            ls -la "${APPLE_REFURB_WATCH_LOG}" || true
            cat "${APPLE_REFURB_WATCH_LOG}/daemon.log" || true
            "$bin" stop || true
            exit 1
          fi
          code=$(curl -sS -o "${RUNNER_TEMP}/arw-home.html" -w "%{http_code}" "http://127.0.0.1:8765/")
          "$bin" stop || true
          echo "home HTTP ${code}"
          if [ "$code" != "200" ]; then
            cat "${RUNNER_TEMP}/arw-home.html" || true
            cat "${APPLE_REFURB_WATCH_LOG}/daemon.log" || true
            exit 1
          fi
          grep -q "官翻监听" "${RUNNER_TEMP}/arw-home.html"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/out/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
